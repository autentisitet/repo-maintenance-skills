name: CI

on:
  push:
    branches: [main]
    # 本仓库的校验对象是 Markdown 结构与链接，因此不能忽略 *.md；
    # 只忽略不参与校验的文件。
    paths-ignore:
      - "LICENSE"
      - "**/*.png"
      - "**/*.jpg"
  pull_request:
    paths-ignore:
      - "LICENSE"
      - "**/*.png"
      - "**/*.jpg"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install validator dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Validate skills
        run: |
          python3 scripts/validate_skills.py
          python3 scripts/test_validate_skills.py
          python3 scripts/test_skill_examples.py
          python3 scripts/validate_skill_evals.py
          python3 skills/markdown-docs/scripts/section-dividers.py --check .
      - name: Check shell scripts parse
        run: |
          shopt -s nullglob
          files=(scripts/*.sh skills/*/scripts/*.sh)
          for f in "${files[@]}"; do
            bash -n "$f" && echo "ok  $f"
          done
      - name: Smoke-test CSS audit
        run: |
          test_dir="$(mktemp -d)"
          printf '.a { padding: 8px; }\n.b { padding: 8px; gap: 12px; }\n' > "$test_dir/sample.css"
          skills/frontend-quality/scripts/audit-css-values.sh "$test_dir" > "$test_dir/audit.log"
          grep -Eq '[[:space:]]2 8px$' "$test_dir/audit.log"
      - name: Smoke-test installer
        run: |
          test_home="$(mktemp -d)"
          CODEX_HOME="$test_home/link" ./scripts/install.sh
          test -L "$test_home/link/skills/markdown-docs"

          CODEX_HOME="$test_home/copy" ./scripts/install.sh --copy
          test -f "$test_home/copy/skills/markdown-docs/SKILL.md"

          CODEX_HOME="$test_home/copy" ./scripts/install.sh --copy --force
          test -f "$test_home/copy/skills/markdown-docs/SKILL.md"

          mkdir -p "$test_home/unmanaged/skills/markdown-docs"
          touch "$test_home/unmanaged/skills/markdown-docs/keep-me"
          if CODEX_HOME="$test_home/unmanaged" ./scripts/install.sh --force \
            >"$test_home/unmanaged.log" 2>&1; then
            echo "installer replaced an unmanaged skill" >&2
            exit 1
          fi
          grep -F "拒绝替换非本项目管理的 skill" "$test_home/unmanaged.log"
          test -f "$test_home/unmanaged/skills/markdown-docs/keep-me"


  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Smoke-test PowerShell installer
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-junction"
          .\scripts\install.ps1
          $link = Get-Item "$env:CODEX_HOME\skills\markdown-docs"
          if ($link.LinkType -ne "Junction") {
            throw "junction install failed"
          }

          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-copy"
          .\scripts\install.ps1 -Copy
          if (-not (Test-Path "$env:CODEX_HOME\skills\markdown-docs\SKILL.md")) {
            throw "initial copy install failed"
          }

          .\scripts\install.ps1 -Copy -Force
          if (-not (Test-Path "$env:CODEX_HOME\skills\markdown-docs\SKILL.md")) {
            throw "forced copy install failed"
          }

          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-unmanaged"
          $unmanaged = Join-Path $env:CODEX_HOME "skills\markdown-docs"
          New-Item -ItemType Directory -Path $unmanaged -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $unmanaged "keep-me") | Out-Null
          $refused = $false
          try {
            .\scripts\install.ps1 -Force
          }
          catch {
            if ($_.Exception.Message -match "拒绝替换非本项目管理的 skill") {
              $refused = $true
            }
            else {
              throw
            }
          }
          if (-not $refused) {
            throw "installer replaced an unmanaged skill"
          }
          if (-not (Test-Path (Join-Path $unmanaged "keep-me"))) {
            throw "unmanaged skill was removed"
          }
