name: CI

on:
  push:
    branches: [main]
  # The main ruleset requires both jobs on every PR, including docs-only changes.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Check dependency lock and export
        run: |
          uv lock --check
          uv export --frozen --no-header --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          tail -n +3 requirements.txt > "$RUNNER_TEMP/requirements-committed.txt"
          diff -u "$RUNNER_TEMP/requirements-committed.txt" "$RUNNER_TEMP/requirements.txt"
      - name: Install validator dependencies
        run: python3 -m pip install --require-hashes -r requirements.txt
      - name: Validate skills
        run: make validate
      - name: Smoke-test CSS audit
        run: |
          test_dir="$(mktemp -d)"
          printf '.a { padding: 8px; }\n.b { padding: 8px; gap: 12px; }\n' > "$test_dir/sample.css"
          skills/frontend-quality/scripts/audit-css-values.sh "$test_dir" > "$test_dir/audit.log"
          grep -Eq '[[:space:]]2 8px$' "$test_dir/audit.log"
      - name: Smoke-test installer
        run: |
          test_home="$(mktemp -d)"
          CODEX_HOME="$test_home/link" ./scripts/links/install.sh
          test -L "$test_home/link/skills/markdown-docs"

          CODEX_HOME="$test_home/copy" ./scripts/links/install.sh --copy
          test -f "$test_home/copy/skills/markdown-docs/SKILL.md"

          CODEX_HOME="$test_home/copy" ./scripts/links/install.sh --copy --force
          test -f "$test_home/copy/skills/markdown-docs/SKILL.md"

          mkdir -p "$test_home/unmanaged/skills/markdown-docs"
          touch "$test_home/unmanaged/skills/markdown-docs/keep-me"
          if CODEX_HOME="$test_home/unmanaged" ./scripts/links/install.sh --force \
            >"$test_home/unmanaged.log" 2>&1; then
            echo "installer replaced an unmanaged skill" >&2
            exit 1
          fi
          grep -F "Refusing to replace an unmanaged skill" "$test_home/unmanaged.log"
          test -f "$test_home/unmanaged/skills/markdown-docs/keep-me"


  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Parse PowerShell skill examples
        run: |
          $text = Get-Content -LiteralPath .\skills\powershell-quality\SKILL.md -Raw
          $blocks = [regex]::Matches($text, '(?ms)^```powershell\s*\r?\n(.*?)^```\s*$')
          if ($blocks.Count -eq 0) {
            throw "No PowerShell examples found"
          }
          foreach ($block in $blocks) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseInput(
              $block.Groups[1].Value, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              throw "Invalid PowerShell example: $($parseErrors[0].Message)"
            }
          }
      - name: Smoke-test PowerShell installer
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-whatif"
          .\scripts\links\install.ps1 -WhatIf
          if (Test-Path "$env:CODEX_HOME\skills\markdown-docs") {
            throw "WhatIf created an installation target"
          }

          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-junction"
          .\scripts\links\install.ps1
          $link = Get-Item "$env:CODEX_HOME\skills\markdown-docs"
          if ($link.LinkType -ne "Junction") {
            throw "junction install failed"
          }

          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-copy"
          .\scripts\links\install.ps1 -Copy
          if (-not (Test-Path "$env:CODEX_HOME\skills\markdown-docs\SKILL.md")) {
            throw "initial copy install failed"
          }

          .\scripts\links\install.ps1 -Copy -Force
          if (-not (Test-Path "$env:CODEX_HOME\skills\markdown-docs\SKILL.md")) {
            throw "forced copy install failed"
          }

          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-unmanaged"
          $unmanaged = Join-Path $env:CODEX_HOME "skills\markdown-docs"
          New-Item -ItemType Directory -Path $unmanaged -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $unmanaged "keep-me") | Out-Null
          $refused = $false
          try {
            .\scripts\links\install.ps1 -Force
          }
          catch {
            if ($_.Exception.Message -match "Refusing to replace an unmanaged skill") {
              $refused = $true
            }
            else {
              throw
            }
          }
          if (-not $refused) {
            throw "installer replaced an unmanaged skill"
          }
          if (-not (Test-Path (Join-Path $unmanaged "keep-me"))) {
            throw "unmanaged skill was removed"
          }
      - name: Smoke-test PowerShell uninstaller
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-uninstall-junction"
          .\scripts\links\install.ps1
          .\scripts\links\uninstall.ps1 -WhatIf
          if (-not (Test-Path "$env:CODEX_HOME\skills\markdown-docs\SKILL.md")) {
            throw "WhatIf removed a managed junction"
          }
          .\scripts\links\uninstall.ps1
          if (Test-Path "$env:CODEX_HOME\skills\markdown-docs") {
            throw "managed junction survived uninstall"
          }

          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-uninstall-copy"
          .\scripts\links\install.ps1 -Copy
          .\scripts\links\uninstall.ps1
          if (Test-Path "$env:CODEX_HOME\skills\markdown-docs") {
            throw "managed copy survived uninstall"
          }

          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-uninstall-unmanaged"
          $unmanaged = Join-Path $env:CODEX_HOME "skills\markdown-docs"
          New-Item -ItemType Directory -Path $unmanaged -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $unmanaged "keep-me") | Out-Null
          .\scripts\links\uninstall.ps1
          if (-not (Test-Path (Join-Path $unmanaged "keep-me"))) {
            throw "uninstaller removed an unmanaged skill"
          }
